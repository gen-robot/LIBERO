# ER-OBJECT Task Definitions
# Principle: Same manipulation (action + target object + goal) in DIFFERENT scene contexts
# Source A: Manipulation source (from libero_object - floor scene)
# Source B: Scene source (from libero_90 - kitchen/living room/study scenes)
#
# 10 two-source tasks + 10 three-source tasks = 20 total

version: "1.0"
group: ER-OBJECT
task_count: 20

# Available scenes from libero_90 for context transfer
scene_templates:
  kitchen_scene1:
    file: libero_90/KITCHEN_SCENE1_put_the_black_bowl_on_the_plate.bddl
    table: kitchen_table
    fixtures: [wooden_cabinet_1]
  kitchen_scene4:
    file: libero_90/KITCHEN_SCENE4_put_the_wine_bottle_on_the_wine_rack.bddl
    table: kitchen_table
    fixtures: [white_cabinet_1, wine_rack_1]
  living_room_scene1:
    file: libero_90/LIVING_ROOM_SCENE1_pick_up_the_alphabet_soup_and_put_it_in_the_basket.bddl
    table: living_room_table
    fixtures: []
  living_room_scene3:
    file: libero_90/LIVING_ROOM_SCENE3_pick_up_the_butter_and_put_it_in_the_tray.bddl
    table: living_room_table
    fixtures: []
  study_scene1:
    file: libero_90/STUDY_SCENE1_pick_up_the_book_and_place_it_in_the_front_compartment_of_the_caddy.bddl
    table: study_table
    fixtures: [desk_caddy_1]

