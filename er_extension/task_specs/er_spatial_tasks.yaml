    goal_target: plate_1
    goal: "(On butter_1 plate_1)"
    
  - id: er_spatial_05
    name: cream_cheese_behind_plate_kitchen1
    scene: kitchen1
    language: "pick up the cream cheese behind the plate and put it on the cabinet"
    manipulated_object: {instance: cream_cheese_1, type: cream_cheese}
    landmark: {instance: plate_1, type: plate}
    relation: behind
    goal_target: wooden_cabinet_1_top_side
    goal: "(On cream_cheese_1 wooden_cabinet_1_top_side)"

  # Living room - different objects with spatial refs
  - id: er_spatial_06
    name: butter_next_to_soup_living2
    scene: living2
    language: "pick up the butter next to the soup and put it in the basket"
    manipulated_object: {instance: butter_1, type: butter}
    landmark: {instance: alphabet_soup_1, type: alphabet_soup}
    relation: next_to
    goal_target: basket_1_contain_region
    goal: "(On butter_1 basket_1_contain_region)"
    
  - id: er_spatial_07
    name: milk_left_of_tomato_living2
    scene: living2
    language: "pick up the milk to the left of the tomato sauce and put it in the basket"
    manipulated_object: {instance: milk_1, type: milk}
    landmark: {instance: tomato_sauce_1, type: tomato_sauce}
    relation: left_of
    goal_target: basket_1_contain_region
    goal: "(On milk_1 basket_1_contain_region)"

  # More kitchen variants
  - id: er_spatial_08
    name: ketchup_in_front_of_bowl_kitchen5
    scene: kitchen5
    language: "pick up the ketchup in front of the black bowl and put it on the plate"
    manipulated_object: {instance: ketchup_1, type: ketchup}
    landmark: {instance: akita_black_bowl_1, type: akita_black_bowl}
    relation: in_front_of
    goal_target: plate_1
    goal: "(On ketchup_1 plate_1)"
    
  - id: er_spatial_09
    name: tomato_right_of_plate_kitchen5
    scene: kitchen5
    language: "pick up the tomato sauce to the right of the plate and put it on the cabinet"
    manipulated_object: {instance: tomato_sauce_1, type: tomato_sauce}
    landmark: {instance: plate_1, type: plate}
    relation: right_of
    goal_target: wooden_cabinet_1_top_side
    goal: "(On tomato_sauce_1 wooden_cabinet_1_top_side)"
    
  - id: er_spatial_10
    name: pudding_next_to_butter_living2
    scene: living2
    language: "pick up the pudding next to the butter and put it in the basket"
    manipulated_object: {instance: chocolate_pudding_1, type: chocolate_pudding}
    landmark: {instance: butter_1, type: butter}
    relation: next_to
    goal_target: basket_1_contain_region
    goal: "(On chocolate_pudding_1 basket_1_contain_region)"

