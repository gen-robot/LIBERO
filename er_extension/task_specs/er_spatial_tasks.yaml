# ER-SPATIAL Task Definitions (Redesigned for Diversity)
# Principle: Same goal, but NOVEL spatial reference for locating the object
# Use diverse scenes, objects, and spatial relations
#
# 10 two-source tasks + 10 three-source tasks = 20 total

version: "2.0"
group: ER-SPATIAL
task_count: 20

# Scene templates with different spatial configurations
scenes:
  kitchen_spatial:
    source: libero_spatial/pick_up_the_black_bowl_next_to_the_ramekin_and_place_it_on_the_plate.bddl
    problem: LIBERO_Tabletop_Manipulation
    table: main_table
    
  kitchen1:
    source: libero_90/KITCHEN_SCENE1_put_the_black_bowl_on_the_plate.bddl
    problem: LIBERO_Kitchen_Tabletop_Manipulation
    table: kitchen_table
    
  kitchen5:
    source: libero_90/KITCHEN_SCENE5_put_the_black_bowl_on_the_plate.bddl
    problem: LIBERO_Kitchen_Tabletop_Manipulation
    table: kitchen_table
    
  living2:
    source: libero_90/LIVING_ROOM_SCENE2_pick_up_the_butter_and_put_it_in_the_basket.bddl
    problem: LIBERO_Living_Room_Tabletop_Manipulation
    table: living_room_table
    
  living5:
    source: libero_90/LIVING_ROOM_SCENE5_put_the_red_mug_on_the_left_plate.bddl
    problem: LIBERO_Living_Room_Tabletop_Manipulation
    table: living_room_table

# Spatial relations and their offsets (dx, dy from landmark center)
spatial_relations:
  next_to: [-0.08, 0.0]
  left_of: [-0.10, 0.0]
  right_of: [0.10, 0.0]
  in_front_of: [0.08, 0.0]
  behind: [-0.08, 0.0]

# ============================================================================
# TWO-SOURCE TASKS (10 tasks) - Diverse objects and landmarks
# ============================================================================

tasks:
  # Kitchen spatial - bowl with different landmarks
  - id: er_spatial_01
    name: bowl_next_to_butter
    scene: kitchen_spatial
    language: "pick up the black bowl next to the butter and place it on the plate"
    manipulated_object: {instance: akita_black_bowl_1, type: akita_black_bowl}
    landmark: {instance: butter_1, type: butter}
    relation: next_to
    goal_target: plate_1
    goal: "(On akita_black_bowl_1 plate_1)"
    
  - id: er_spatial_02
    name: bowl_left_of_ketchup
    scene: kitchen_spatial
    language: "pick up the black bowl to the left of the ketchup and place it on the plate"
    manipulated_object: {instance: akita_black_bowl_1, type: akita_black_bowl}
    landmark: {instance: ketchup_1, type: ketchup}
    relation: left_of
    goal_target: plate_1
    goal: "(On akita_black_bowl_1 plate_1)"
    
  - id: er_spatial_03
    name: bowl_right_of_milk
    scene: kitchen_spatial
    language: "pick up the black bowl to the right of the milk and place it on the plate"
    manipulated_object: {instance: akita_black_bowl_1, type: akita_black_bowl}
    landmark: {instance: milk_1, type: milk}
    relation: right_of
    goal_target: plate_1
    goal: "(On akita_black_bowl_1 plate_1)"

  # Kitchen scene 1 - different manipulated objects
  - id: er_spatial_04
    name: butter_next_to_bowl_kitchen1
    scene: kitchen1
    language: "pick up the butter next to the black bowl and put it on the plate"
    manipulated_object: {instance: butter_1, type: butter}
    landmark: {instance: akita_black_bowl_1, type: akita_black_bowl}
